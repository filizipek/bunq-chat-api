services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - chat_db:/app/storage
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:latest
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro
    restart: unless-stopped

volumes:
  chat_db:
