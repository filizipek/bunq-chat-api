openapi: 3.0.3
info:
  title: Chat API (Slim + SQLite)
  version: 1.0.0
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK

  /auth/register:
    post:
      summary: Register a user and return token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
            example:
              name: Alice
      responses:
        "201":
          description: Created
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /groups:
    get:
      summary: List groups
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, example: 20 }
        - in: query
          name: offset
          schema: { type: integer, example: 0 }
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
    post:
      summary: Create a group (creator auto-joins)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
            example:
              name: Public Group 1
              description: general
      responses:
        "201":
          description: Created
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /groups/{groupId}/join:
    post:
      summary: Join a group
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: integer, example: 1 }
      responses:
        "200":
          description: Joined
        "401":
          description: Unauthorized
        "404":
          description: Group not found

  /groups/{groupId}/messages:
    post:
      summary: Post a message to a group
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
            example:
              content: Hello!
      responses:
        "201":
          description: Created
        "401":
          description: Unauthorized
        "403":
          description: Not a member
        "400":
          description: Validation error

    get:
      summary: List messages in a group
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: groupId
          required: true
          schema: { type: integer, example: 1 }
        - in: query
          name: limit
          schema: { type: integer, example: 50 }
        - in: query
          name: offset
          schema: { type: integer, example: 0 }
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "403":
          description: Not a member
